services:
  db:
    image: postgres:15-alpine
    container_name: cc-postgres
    restart: always
    environment:
      POSTGRES_USER: ccuser
      POSTGRES_PASSWORD: ccpassword
      POSTGRES_DB: careercompass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cc-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  server:
    build:
      # Repo root, not ./server — the image bundles both the backend and the
      # dashboard built from client/. See docs/adr/0004-same-origin-web-dashboard.md.
      context: .
      dockerfile: server/Dockerfile
    container_name: cc-server
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://ccuser:ccpassword@db:5432/careercompass?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-generate_a_random_32_character_long_secret_key}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # One poller per token. Set false on any instance that should not own
      # the bot — two pollers produce a 409 every few seconds, forever.
      ENABLE_TELEGRAM: ${ENABLE_TELEGRAM:-true}
      # Every variable the server reads must be named here. Compose substitutes
      # ${...} from the .env in the project directory, but a variable that is
      # not listed simply never reaches the container — setting it in
      # ~/cc-config/.env alone does nothing.
      #
      # Unset means registration is CLOSED once an account exists, which is the
      # intended default. See server/src/auth/routes.ts.
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
      # Layer 1 of the email finder. Unset, the layer is skipped and lookups
      # fall through to patterns + SMTP. 100 free credits on signup; billed
      # per valid email found. https://anymailfinder.com/email-finder-api
      ANYMAILFINDER_API_KEY: ${ANYMAILFINDER_API_KEY}
      # What `llmProvider: 'server'` — the default for new accounts — resolves
      # to. `host.docker.internal` pairs with the `extra_hosts` entry below and
      # is how this container reaches an Ollama running on the Docker host;
      # `localhost` would be the container itself. The model must be one the
      # host has actually pulled (`ollama list`).
      DEFAULT_LLM_URL: ${DEFAULT_LLM_URL:-http://host.docker.internal:11434}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-mistral-small:24b}
      # Identity used in the SMTP RCPT probe. A real domain you control makes
      # the probe look like an ordinary sender rather than a forged one; some
      # mail servers reject a MAIL FROM whose domain does not resolve.
      SMTP_PROBE_HELO: ${SMTP_PROBE_HELO:-localhost}
      SMTP_PROBE_FROM: ${SMTP_PROBE_FROM:-verify@localhost}
    volumes:
      # Résumé attachments. Without this they live in the container's writable
      # layer and every deploy silently discards them, so a campaign started
      # after a deploy would send with no CV attached.
      - server_uploads:/app/uploads
    cap_add:
      - SYS_ADMIN
    shm_size: '1gb'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
  redis_data:
  server_uploads:

# ─── MTU ─────────────────────────────────────────────────────────
#
# The VM's `ens3` is **1442**, not 1500 — it sits behind a tunnel. Docker
# defaults its bridge to 1500 regardless, so containers emitted frames the host
# link could not carry. Small packets got through and the first large one was
# silently dropped, which is not a failure mode that looks like a network
# problem from inside the app:
#
#   * the TCP handshake completes, so a port check says the host is reachable
#   * SMTP's plaintext greeting on 587 arrives, ~80 bytes
#   * the TLS certificate does not — `nodemailer` sat until its 2 min
#     connection timeout and reported "Connection timeout", which reads like a
#     blocked port or a bad credential
#
# Measured 2026-08-10: from a 1500-MTU container, TLS to smtp.gmail.com:465
# timed out; from an otherwise identical 1400-MTU container it completed.
# `ping -M do` puts the path MTU to Gmail at ~1440.
#
# This is also why `ipinfo.io` was unreachable from `cc-server` while LinkedIn
# was fine (see tasks/lessons.md) — not a blocked provider, just a response
# whose TLS handshake did not fit.
#
# 1442 matches the host interface. If the VM is ever rehomed, re-measure with
# `cat /sys/class/net/ens3/mtu` rather than assuming this number.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1442
