services:
  db:
    image: postgres:15-alpine
    container_name: cc-postgres
    restart: always
    environment:
      POSTGRES_USER: ccuser
      POSTGRES_PASSWORD: ccpassword
      POSTGRES_DB: careercompass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cc-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cc-server
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://ccuser:ccpassword@db:5432/careercompass?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: production
      # No default: JWT_SECRET must be set in the environment (e.g. .env).
      # Falling back to a hardcoded value here would let anyone who has read
      # this file forge a valid session token for any user.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      # Encrypts cached LinkedIn session cookies at rest. Generate with:
      # openssl rand -hex 32
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY must be set (see .env.example)}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Comma-separated list of extra allowed origins for the REST/WS CORS
      # policy. The server always allows this repo's own extension ID
      # (server/src/config/env.ts); set this only for additional web UIs.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
