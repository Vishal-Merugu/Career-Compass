name: Deploy to VM

# The VM is reachable only over the university VPN, so GitHub's hosted runners
# can never connect to it. A self-hosted runner on the VM solves this by
# dialling out to GitHub instead — no inbound route needed.
#
# Manual only, on purpose: deploys happen when you decide, not on every push
# to main. Use the "Run workflow" button in the Actions tab and pick the branch
# you want live.
#
# This also means no automatic trigger exists at all, which matters because the
# repo is PUBLIC — a `push` or `pull_request` trigger on a self-hosted runner
# would let fork PRs execute code on the VM. Keep it dispatch-only while public.

# The schema is applied by the container itself (`prisma migrate deploy` in
# server/Dockerfile's CMD), so there is no schema step here and no input to skip
# one. There used to be a `db push` step; running it *after* the CMD's
# `migrate deploy` would push schema.prisma straight onto the database and leave
# `_prisma_migrations` describing something the database no longer matches —
# which is the drift migrations exist to prevent.
on:
  workflow_dispatch:

concurrency:
  group: vm-deploy
  cancel-in-progress: false

env:
  # Pin the compose project name. It otherwise defaults to the directory name,
  # and the runner's workspace ("Career-Compass") differs from the old manual
  # clone ("CareerCompass") — which would silently create a SECOND set of
  # volumes and hand you an empty database.
  COMPOSE_PROJECT_NAME: careercompass

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7

      - name: Restore gitignored config
        run: |
          set -euo pipefail
          # Lives in the runner user's home on the VM — gitignored files that
          # must survive across deploys.
          CFG="$HOME/cc-config"
          if [ ! -f "$CFG/.env" ]; then
            echo "::error::Missing $CFG/.env on the VM."
            echo "Create it once: mkdir -p $CFG && cp your .env and linkedin-cookies.json there"
            exit 1
          fi
          cp "$CFG/.env" .env
          if [ -f "$CFG/linkedin-cookies.json" ]; then
            cp "$CFG/linkedin-cookies.json" server/linkedin-cookies.json
            echo "Restored .env and linkedin-cookies.json"
          else
            echo "::warning::No linkedin-cookies.json in $CFG — the probe will not run"
          fi

      - name: Build server image
        # No --no-cache: Docker already invalidates layers when files change,
        # and rebuilding from scratch every deploy was pure wasted minutes.
        run: docker compose build server

      - name: Start containers
        run: docker compose up -d

      - name: Verify the server is actually up
        # Polls /health rather than `compose ps --status running`. The container
        # has `restart: always`, so a boot that dies every few seconds — a failed
        # migration, an unreachable Redis — spends part of each cycle reporting
        # "running" and the old check passed a deploy that was crash-looping.
        # Answering on the port is the only proof it got past startup.
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -fsS -m 5 http://localhost:3000/health >/dev/null 2>&1; then
              echo "server is healthy"
              exit 0
            fi
            echo "waiting for /health... ($i/24)"
            sleep 5
          done
          echo "::error::server did not answer /health within 2 minutes"
          docker compose ps
          docker compose logs --tail 60 server
          exit 1

      - name: Report
        if: always()
        run: |
          echo "### Deploy ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
