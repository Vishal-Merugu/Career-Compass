name: PR Checks

# The only automatic gate in this repo. `deploy.yml` is manual-dispatch-only, so
# without this workflow nothing ever ran on its own — the husky pre-commit hook
# is the sole check, and `git commit --no-verify` walks straight past it.
#
# Runs on GitHub-HOSTED runners, deliberately. Never move these jobs to
# `self-hosted`: the repo is public, and a fork PR would then execute arbitrary
# code on the deployment VM.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          # Two lockfiles, two node_modules trees — the root holds the tooling
          # (eslint/prettier/husky), server/ holds the actual application.
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: Install server deps
        run: npm ci --prefix server

      - name: Generate Prisma client
        # tsc reads the generated @prisma/client types; without this, typecheck
        # fails on every `prisma.*` call rather than on anything real.
        run: npm --prefix server run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build server
        run: npm --prefix server run build

      - name: Build extension zip
        run: npm run build:ext
